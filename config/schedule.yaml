pipelines:
  - id: "01_DETECCIONES_SEMA"
    script: "pipelines/01_DETECCIONES_SEMA.py"
    interval_minutes: 720
    offset_minutes: 120
    enabled: true
    args: []

  - id: "02_DETECCIONES_30MIN"
    script: "pipelines/02_DETECCIONES_30MIN.py"
    interval_minutes: 30
    offset_minutes: 20
    start_time: "04:00"
    end_time: "23:55"
    enabled: true
    args: []

  - id: "03_ESTADOS_SEMA_SUA"
    script: "pipelines/03_Estados_SEMA_SUA.py"
    interval_minutes: 30
    offset_minutes: 15
    enabled: true
    args: []

  - id: "04_PLANES_SEMA"
    script: "pipelines/04_PLANES_SEMA.py"
    interval_minutes: 30
    offset_minutes: 10
    enabled: true
    args: []

  - id: "05_ANEXO_SEMA"
    script: "pipelines/05_ANEXO_SEMA.py"
    interval_minutes: 720
    offset_minutes: 60
    enabled: true
    args: []

  - id: "06_MANTENIMIENTO_SEMA"
    script: "pipelines/06_MANTENIMIENTO_SEMA.py"
    interval_minutes: 1440
    offset_minutes: 180
    weekdays: ["monday"]
    enabled: true
    args: []

  - id: "07_KPI_SEMA.py"
    script: "pipelines/07_KPI_SEMA.py"
    interval_minutes: 720
    offset_minutes: 90
    enabled: true
    args: []

  - id: "08_FIN_SEM_SEMA"
    script: "pipelines/08_FIN_SEM_SEMA.py"
    interval_minutes: 60
    offset_minutes: 55
    weekdays: ["friday", "saturday", "sunday", "monday"]
    run_if_previous_day_holiday: true
    start_time: "06:55"
    end_time: "20:55"
    enabled: true
    args: []

  - id: "09_PRIORIDAD_SEMA"
    script: "pipelines/09_PRIORIDAD_SEMA.py"
    interval_minutes: 1440
    offset_minutes: 0
    weekdays: ["monday"]
    start_time: "04:00"
    enabled: true
    args: []

  - id: "10_PROMEDIOS_SEMA"
    script: "pipelines/10_PROMEDIOS_SEMA.py"
    interval_minutes: 5
    offset_minutes: 0
    weekdays: ["saturday", "sunday"]
    start_time: "22:00"
    end_time: "23:55"
    timeout_minutes: 120
    enabled: true
    args: []
